<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>His Style Makeover</title>
<style>
/* Layout: one narrow column per quiz screen; answer buttons stay pinned at the bottom; the final page widens to 760px and scrolls. Light theme only: cool blue-grey ground, white answer cards, navy accent, brass highlight. Revera's layout logic in men's colours. */
:root{
  --bg:#EDF0F4;
  --surface:#FFFFFF;
  --panel:#DFE5EC;
  --ink:#101923;
  --muted:#38434F;
  --faint:#56616D;
  --line:#C3CCD7;
  --accent:#1C3557;
  --accent-ink:#FFFFFF;
  --accent-soft:#DCE6F2;
  --brass:#B07A35;
  --brass-ink:#7E5320;
  --error:#A3321F;
  --shadow:0 1px 2px rgba(16,25,35,.06),0 3px 10px rgba(16,25,35,.06);
  --font-display:Georgia,"Times New Roman",serif;
  --font-body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:18px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.app{min-height:100%;display:flex;flex-direction:column;max-width:480px;margin:0 auto;padding-inline:16px;padding-block:0 0}
.app.wide{max-width:760px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px 8px}
.bar{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;height:40px}
.back{width:40px;height:40px;border:0;background:transparent;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.back:hover{background:var(--panel)}
.back.off{visibility:hidden;pointer-events:none}
.back svg{width:22px;height:22px}
.brand{text-align:center;font-family:var(--font-body);font-weight:800;font-size:14px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink)}
.brand b{color:var(--brass);font-weight:800}
.count{text-align:right;font-size:14px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.progress{height:5px;background:#D3DAE3;border-radius:5px;overflow:hidden;margin-top:6px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--brass));width:0;transition:width .45s ease;border-radius:5px}
main{flex:1;display:flex;flex-direction:column}
.screen{flex:1;display:flex;flex-direction:column;gap:14px;padding-top:10px;padding-bottom:20px;animation:in .35s ease both}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.eyebrow{align-self:flex-start;font-size:14px;font-weight:700;color:var(--brass-ink)}
.pill{align-self:flex-start;font-size:14px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:5px 12px;border-radius:30px}
h1,h2,h3{font-family:var(--font-display);font-weight:700;margin:0;text-wrap:balance;line-height:1.18;color:var(--ink)}
h1{font-size:30px}
h2{font-size:25px}
.sub{margin:0;color:var(--muted);font-size:17px;text-wrap:pretty}
.hint{margin:-6px 0 0;color:var(--muted);font-size:15px}
.options{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;align-items:center;gap:12px;min-height:54px;padding:11px 16px;border:2px solid var(--line);background:var(--surface);border-radius:14px;text-align:left;cursor:pointer;font-size:17px;font-weight:500;line-height:1.3;box-shadow:var(--shadow);transition:transform .12s ease,border-color .15s,background .15s;animation:pop .35s ease both}
.opt:hover{border-color:#9FAEBF}
.opt:active{transform:scale(.98)}
.opt:focus-visible,.card:focus-visible,.btn:focus-visible,.back:focus-visible,.plan:focus-visible,summary:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.opt .box{flex:none;width:22px;height:22px;border-radius:6px;border:2px solid #8C9AAA;display:grid;place-items:center;background:var(--surface)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .box{background:var(--accent);border-color:var(--accent)}
.opt.sel .box::after{content:"";width:6px;height:11px;border:solid var(--accent-ink);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.card{position:relative;display:flex;flex-direction:column;border:2px solid var(--line);background:var(--surface);border-radius:14px;overflow:hidden;cursor:pointer;padding:0;text-align:left;box-shadow:var(--shadow);transition:transform .12s,border-color .15s;animation:pop .35s ease both}
.card:active{transform:scale(.98)}
.card img{display:block;width:100%;object-fit:cover;background:var(--panel)}
.card .lbl{padding:8px 10px 10px;font-size:15px;font-weight:700;line-height:1.25}
.card .lbl small{display:block;font-weight:500;color:var(--muted);font-size:13px;margin-top:2px}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.card.sel .lbl{background:var(--accent-soft)}
.card .tick{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;background:var(--surface);border:2px solid #8C9AAA;display:grid;place-items:center;z-index:1}
.card.sel .tick{background:var(--accent);border-color:var(--accent)}
.card.sel .tick::after{content:"";width:6px;height:11px;border:solid var(--accent-ink);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.img-sq{aspect-ratio:1/1;max-height:calc((100dvh - 290px)/2)}
.img-pt{aspect-ratio:3/4;max-height:calc((100dvh - 300px)/2);object-position:center top}
.look-img{aspect-ratio:3/4;object-position:center top}
.agecard img{aspect-ratio:4/5;object-position:center 12%;max-height:calc((100dvh - 410px)/2)}
.agecard .lbl{text-align:center;font-size:18px}
.shape img{aspect-ratio:1/2;object-fit:contain;max-height:calc((100dvh - 320px)/2);background:#EFEBE4}
.shape .unsure{display:grid;place-items:center;aspect-ratio:1/2;max-height:calc((100dvh - 320px)/2);background:#EFEBE4;font-family:var(--font-display);font-size:44px;font-weight:700;color:var(--muted)}
.shape .lbl{text-align:center;font-size:14px;padding:7px 4px 9px}
.terms{font-size:13px;color:var(--faint);text-align:center;margin:0}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:56px;border:0;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:18px;cursor:pointer;box-shadow:0 6px 16px rgba(28,53,87,.28);transition:transform .12s,opacity .2s}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.4;cursor:not-allowed;box-shadow:none}
.actions{position:sticky;bottom:0;margin-top:0;padding-top:18px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(rgba(237,240,244,0),var(--bg) 28%);z-index:3}
.screen > .btn{margin-top:10px}
.aha > .btn{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));margin-top:12px}
/* Aha */
.aha{gap:12px}
.aha .visual{background:var(--surface);border-radius:18px;padding:14px;display:flex;align-items:center;justify-content:center;gap:16px;box-shadow:var(--shadow)}
.big{font-family:var(--font-display);font-size:52px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1}
.personal{margin:0;padding:12px 14px;background:var(--accent-soft);border-left:4px solid var(--accent);border-radius:10px;font-size:16px;font-weight:600;color:var(--ink)}
.aha p{margin:0}
.body{font-size:17px;color:var(--ink)}
.good{font-size:17px;font-weight:700}
.src{font-size:12.5px;color:var(--faint);font-style:italic}
.figs{display:flex;gap:10px}
.figs svg{width:34px;height:64px}
.figs .f{fill:#B9C3CF;transition:fill .6s ease}
.figs .on .f{fill:var(--brass)}
.picks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.picks div{position:relative;border-radius:12px;overflow:hidden;border:3px solid transparent;transition:border-color .4s,transform .4s}
.picks img{display:block;width:100%;height:min(22dvh,180px);object-fit:cover;object-position:center top}
.picks .win{border-color:var(--accent);transform:translateY(-4px)}
.picks .badge{white-space:nowrap;position:absolute;left:6px;bottom:6px;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:700;padding:3px 8px;border-radius:20px;opacity:0;transition:opacity .4s .2s}
.picks .win .badge{opacity:1}
.keepadd{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;width:100%}
.keepadd figure{margin:0;position:relative}
.keepadd img{display:block;width:100%;height:min(24dvh,170px);object-fit:cover;object-position:center;border-radius:12px}
.keepadd figcaption{position:absolute;left:6px;top:6px;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:700;padding:3px 9px;border-radius:20px}
.keepadd figure:last-child figcaption{background:var(--brass)}
.keepadd .plus{font-size:28px;color:var(--brass);font-weight:700}
/* Loader */
.loader{gap:18px;padding-top:40px}
.ring{width:96px;height:96px;margin:0 auto}
.ring circle{fill:none;stroke-width:8}
.ring .t{stroke:#D3DAE3}
.ring .p{stroke:var(--accent);stroke-linecap:round;stroke-dasharray:264;stroke-dashoffset:264;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset 6s linear}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.checks li{display:flex;gap:10px;align-items:flex-start;font-size:16px;color:var(--faint);transition:color .3s}
.checks li .c{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid #A9B5C3;display:grid;place-items:center;transition:background .3s,border-color .3s}
.checks li.done{color:var(--ink);font-weight:600}
.checks li.done .c{background:var(--accent);border-color:var(--accent)}
.checks li.done .c::after{content:"";width:5px;height:9px;border:solid var(--accent-ink);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
/* Email */
.summary{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:4px 16px;box-shadow:var(--shadow)}
.row{display:grid;grid-template-columns:1fr;gap:2px;padding:10px 0;border-bottom:1px solid #DDE3EA}
.row:last-child{border-bottom:0}
.row .k{font-size:13px;font-weight:600;color:var(--muted)}
.row .v{font-size:16px;font-weight:700}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:15px;font-weight:700}
.field input{min-height:56px;border:2px solid var(--line);border-radius:14px;padding:0 16px;font:inherit;font-size:17px;background:var(--surface);color:var(--ink)}
.field input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.err{color:var(--error);font-size:14px;font-weight:600;margin:0}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:15px;color:var(--muted)}
.chk input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent)}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.note{font-size:13px;color:var(--faint);text-align:center;margin:0}
/* Reviews */
.reviews{display:grid;grid-template-columns:1fr;gap:10px}
.rev{background:var(--surface);border:1px solid #D6DDE6;border-radius:16px;padding:14px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px}
.rev .who{display:flex;align-items:center;gap:10px}
.rev .av{width:38px;height:38px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:15px}
.rev .who b{display:block;font-size:15px}
.rev .stars{color:var(--brass);font-size:14px;letter-spacing:2px}
.rev p{margin:0;font-size:15.5px;color:var(--ink)}
.revnote{font-size:12.5px;color:var(--faint);margin:0}
/* Final */
.final{gap:26px;padding-top:6px;padding-bottom:100px}
.final section{display:flex;flex-direction:column;gap:12px}
.sent{font-size:14px;color:var(--accent);font-weight:600;background:var(--accent-soft);padding:8px 12px;border-radius:10px;align-self:flex-start}
.nowgoal{display:grid;grid-template-columns:1fr 1fr;gap:10px;position:relative}
.nowgoal figure{margin:0;display:flex;flex-direction:column;gap:6px}
.nowgoal img{width:100%;aspect-ratio:3/4;object-fit:cover;object-position:center top;border-radius:14px;background:var(--panel);box-shadow:var(--shadow)}
.nowgoal figcaption{font-size:14px;font-weight:700}
.nowgoal figcaption span{display:block;font-weight:500;color:var(--muted)}
.disc{font-size:12.5px;color:var(--faint);margin:0}
.profile{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:4px 18px;box-shadow:var(--shadow)}
.profile .row .v{font-size:17px}
.profile .row .x{font-size:15px;color:var(--muted)}
.verdict{background:var(--accent);color:var(--accent-ink);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:12px}
.verdict p{margin:0;font-family:var(--font-display);font-weight:700;font-size:23px;line-height:1.22}
.verdict .btn{background:var(--surface);color:var(--accent);box-shadow:none}
h3{font-size:23px}
.gets{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr;gap:10px}
.gets li{display:grid;grid-template-columns:36px 1fr;gap:12px;align-items:start;background:var(--surface);border:1px solid #D6DDE6;border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.gets .ic{width:36px;height:36px;border-radius:10px;background:var(--accent-soft);display:grid;place-items:center}
.gets .ic svg{width:20px;height:20px;stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.gets b{display:block;font-size:16px}
.gets span{font-size:15px;color:var(--muted)}
.weeks{display:flex;flex-direction:column;gap:8px}
.week{display:grid;grid-template-columns:70px 1fr;gap:10px;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid #D6DDE6}
.week .w{font-size:13px;font-weight:700;color:var(--brass-ink);text-transform:uppercase;letter-spacing:.06em;padding-top:2px}
.week.blur .t{filter:blur(4px);user-select:none}
.week .t{font-size:16px}
.goals{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:0;padding:0}
.goals li{background:var(--accent-soft);color:var(--accent);border-radius:30px;padding:7px 14px;font-size:15px;font-weight:700}
.plans{display:flex;flex-direction:column;gap:12px}
.plan{position:relative;display:grid;grid-template-columns:24px 1fr auto;gap:12px;align-items:center;padding:16px;border:2px solid var(--line);border-radius:16px;background:var(--surface);cursor:pointer;text-align:left;box-shadow:var(--shadow)}
.plan.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.plan .rd{width:22px;height:22px;border-radius:50%;border:2px solid #8C9AAA;display:grid;place-items:center}
.plan.sel .rd{border-color:var(--accent)}
.plan.sel .rd::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--accent)}
.plan .nm{font-weight:700;font-size:17px}
.plan .pr{font-size:14px;color:var(--muted)}
.plan .pr s{color:var(--faint)}
.plan .pd{text-align:right;font-variant-numeric:tabular-nums}
.plan .pd b{display:block;font-size:22px}
.plan .pd span{font-size:13px;color:var(--muted)}
.plan .tag{position:absolute;top:-12px;left:16px;background:var(--brass);color:var(--accent-ink);font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px}
.renew{font-size:13.5px;color:var(--muted);margin:0}
.proto{font-size:14px;font-weight:600;color:var(--ink);background:var(--panel);border-radius:10px;padding:10px 12px;margin:0}
details{background:var(--surface);border:1px solid #D6DDE6;border-radius:14px;padding:0 14px}
summary{cursor:pointer;list-style:none;font-weight:700;font-size:16px;padding:14px 0;display:flex;justify-content:space-between;gap:10px}
summary::after{content:"+";color:var(--accent);font-size:20px;line-height:1}
details[open] summary::after{content:"–"}
details p{margin:0 0 14px;font-size:16px;color:var(--muted)}
.foot{font-size:12.5px;color:var(--faint)}
.float{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(rgba(237,240,244,0),var(--bg) 35%);display:flex;justify-content:center;transition:opacity .25s,transform .25s;z-index:6}
.float .btn{max-width:440px;animation:pulse 2.4s ease-in-out infinite}
.float.hide{opacity:0;transform:translateY(20px);pointer-events:none}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(28,53,87,.35)}50%{box-shadow:0 0 0 9px rgba(28,53,87,0)}}
@media (min-width:700px){
  .reviews.wide3{grid-template-columns:repeat(3,1fr)}
  .gets{grid-template-columns:1fr 1fr}
  h1{font-size:34px}
}
@media (max-height:780px){
  h1{font-size:25px} h2{font-size:22px} .sub{font-size:15.5px} .hint{font-size:14.5px}
  .opt{min-height:46px;padding:8px 14px;font-size:15.5px} .screen{gap:10px} .options{gap:7px}
  .btn{min-height:52px}
  .aha .visual{padding:10px} .big{font-size:40px} .figs svg{width:28px;height:52px}
  .personal{font-size:15px;padding:10px 12px} .body,.good{font-size:15.5px}
  .card .lbl{padding:6px 9px 8px;font-size:14px} .card .lbl small{font-size:12.5px}
  .dense .opt{min-height:42px;padding:7px 14px;font-size:15px} .dense{gap:6px}
  .summary{padding:2px 14px} .summary .row{padding:7px 0} .field input{min-height:50px}
  .actions{padding-top:16px}
  .agecard img{max-height:calc((100dvh - 450px)/2)}
}

/* fit-to-screen quiz */
.app:not(.wide){height:100dvh;min-height:0}
.app:not(.wide) main{min-height:0}
.app:not(.wide) .screen{min-height:0}
.fill{flex:1 1 0;min-height:0;grid-auto-rows:minmax(0,1fr)}
.fill .card{min-height:0}
.fill .card img,.fill .card .unsure{flex:1 1 0;min-height:0;height:0;aspect-ratio:auto;max-height:none}
.fill .card img{object-position:center 22%}
.fill.grid3 .card img{object-fit:contain;object-position:center}
.agecard .lbl{padding:6px 8px 7px}
.visual.grow{flex:1 1 0;min-height:110px;align-items:stretch}
.grow .picks,.grow .keepadd{height:100%}
.grow .picks div,.grow .keepadd figure{height:100%;min-height:0}
.grow .picks img,.grow .keepadd img{height:100%;max-height:none}
.grow .keepadd{grid-template-rows:100%}
.mini{position:relative;display:flex;flex-direction:column;gap:4px}
.mini-track{display:grid}
.mini-card{grid-area:1/1;background:var(--surface);border:1px solid #D6DDE6;border-radius:14px;padding:10px 12px;box-shadow:var(--shadow);opacity:0;transition:opacity .5s;display:flex;flex-direction:column;gap:5px}
.mini-card.on{opacity:1}
.mini-card .who{display:flex;align-items:center;gap:8px;font-size:14px}
.mini-card .av{width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:12px}
.mini-card .stars{color:var(--brass);font-size:12px;letter-spacing:1px;margin-left:auto}
.mini-card p{margin:0;font-size:14px;line-height:1.35}
.mini .revnote{font-size:11.5px;text-align:center}
@media (max-height:780px){
  .dense .opt{min-height:38px;padding:6px 12px;font-size:14.5px} .dense{gap:5px}
  .email-tight .summary .row{padding:5px 0} .email-tight .row .v{font-size:15px}
  .field input{min-height:48px}
}
@media (max-height:680px){
  .screen{gap:8px;padding-top:6px} h2{font-size:20px} h1{font-size:22px} .sub{font-size:14.5px}
  .opt{min-height:42px;font-size:15px} .btn{min-height:48px;font-size:16px}
  .personal{font-size:14px} .body,.good{font-size:14.5px} .src{font-size:11.5px}
  .card .lbl{font-size:13px;padding:5px 8px 6px} .card .lbl small{display:none}
  .mini-card p{font-size:13px}
}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.mini-card p{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.email-tight .chk{font-size:14px}

/* ---------- Derived values ---------- */
const firstOf = (list, picked) => list.find(x => (picked||[]).includes(x[0]));
/* Priority: when several answers are picked, the aha uses the strongest one, not the first. */
const PRI = {
  bothers:['mismatch','same','occasion','suits','fit','worn','effort'],
  tried:['outfits','pinterest','bought','gifts','shopping','shown','stylist','nothing'],
  barriers:['wear','feelings','money','suits','shopping','time','none'],
  desires:['d4','d2','d0','d3','d1','d5']
};
const topOf = (list, picked, order) => { const set=new Set(picked||[]); const k=order.find(x=>set.has(x)); return k?list.find(x=>x[0]===k):null; };
const D = {
  dir:()=>DIRS[A.dir||'classic'], now:()=>NOW[A.now||'casual'], shape:()=>SHAPES[A.shape||'unsure'],
  bother:()=>topOf(BOTHERS,A.bothers,PRI.bothers)||BOTHERS[0],
  tried:()=>topOf(TRIED,A.tried,PRI.tried)||TRIED[7],
  occasion:()=>{const o=firstOf(OCCASIONS,A.occasions); return o?o[2]:'everyday life'},
  barrier:()=>{const b=topOf(BARRIERS,(A.barriers||[]).filter(x=>x!=='none'),PRI.barriers); return b||BARRIERS[0]},
  barrierPicked:()=>!!firstOf(BARRIERS.filter(x=>x[0]!=='none'),A.barriers),
  desireKey:()=>{const set=new Set(A.desires||[]); return PRI.desires.find(k=>set.has(k))||'d0'},
  desire:()=>DESIRES[+D.desireKey().slice(1)],
  goalImg:()=>{const d=A.dir||'classic'; const l=(A.looks||[])[0]||'1'; return 'look-'+d+'-'+l}

/* ---------- Chrome ---------- */
function chrome(step){
  const q = step.q;
  const lastQ = [...FLOW.slice(0,idx+1)].reverse().find(s=>s.q);
  const inQuiz = !['loader','email','final'].includes(step.type);
  document.getElementById('progress').hidden = !inQuiz;
  document.getElementById('count').textContent = inQuiz && lastQ ? lastQ.q + '/10' : '';
  document.getElementById('bar').style.width = inQuiz && lastQ ? (lastQ.q/10*100)+'%' : '0';
  document.getElementById('back').classList.toggle('off', idx===0 || step.type==='loader' || step.type==='final');
  document.getElementById('app').classList.toggle('wide', step.type==='final');
  document.getElementById('app').classList.toggle('hookwide', step.type==='hook');
}
function go(n){ hist.push(idx); idx=n; render(); window.scrollTo(0,0); }
function next(){ go(idx+1); }
document.getElementById('back').onclick = () => { if(!hist.length) return; idx = hist.pop(); if(FLOW[idx].type==='loader'){ idx = hist.pop() ?? 0; } render(); };

function render(){
  const step = FLOW[idx]; chrome(step);
  const fl = document.getElementById('float'); fl.hidden = step.type!=='final';
  main.innerHTML = ''; const s = document.createElement('section'); s.className='screen'; main.appendChild(s);
  ({hook,multi,cards,shapes,looks,aha1,aha2,ahaShared,aha3,loader,email,final})[step.type](s, step);
}

function multi(s, st){

    const k=o.dataset.k;
    if(picked.has(k)) picked.delete(k); else {
      if(st.exclusive && k===st.exclusive) picked.clear();
      else if(st.exclusive) picked.delete(st.exclusive);
      picked.add(k);

    s.querySelectorAll('.opt').forEach(x=>{const on=picked.has(x.dataset.k); x.classList.toggle('sel',on); x.setAttribute('aria-pressed',on)});
    btn.disabled = !picked.size;

function countUp(el, to, suffix, ms=1100){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){el.textContent=to+suffix;return}
  const t0=performance.now(); const tick=t=>{const p=Math.min(1,(t-t0)/ms); el.textContent=Math.round(to*p*(2-p))+suffix; if(p<1) requestAnimationFrame(tick)}; requestAnimationFrame(tick);
}

function sendLead(){

    if(!/^https?:$/.test(location.protocol) || /claude|localhost|github\.io/.test(location.hostname)) return;
    const lab=(list,keys)=>(keys||[]).map(k=>{const x=list.find(r=>r[0]===k);return x?x[1]:k});
    const data={
      email:A.email, tips:!!A.tips, age:A.age||'',
      bothers:lab(BOTHERS,A.bothers), style_now:A.now?NOW[A.now].name:'', tried:lab(TRIED,A.tried),
      shape:A.shape?SHAPES[A.shape].name:'', occasions:lab(OCCASIONS,A.occasions),
      direction:A.dir?DIRS[A.dir].name:'', looks:(A.looks||[]).length,
      barriers:lab(BARRIERS,A.barriers), desires:(A.desires||[]).map(k=>DESIRES[+k.slice(1)])
    };
    fetch('/api/lead',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data),keepalive:true}).catch(()=>{});
  }catch(e){}
}

  const sync=()=>{const p=PLANS.find(x=>x.k===plan);
    s.querySelectorAll('.plan').forEach(x=>{const on=x.dataset.k===plan; x.classList.toggle('sel',on); x.setAttribute('aria-checked',on)});

  sync();
  s.querySelectorAll('.plan').forEach(b=>b.onclick=()=>{plan=b.dataset.k; A.plan=plan; sync();});
  const toPlans=()=>$('#plans',s).scrollIntoView({behavior:'smooth',block:'start'});
  $('#barBtn',s).onclick=toPlans; document.getElementById('floatBtn').onclick=toPlans;
  s.querySelectorAll('.pay').forEach(b=>b.onclick=()=>{b.nextElementSibling.hidden=false});
  const fl=document.getElementById('float'); const vis=new Set();
  const io=new IntersectionObserver(es=>{es.forEach(e=>e.isIntersecting?vis.add(e.target):vis.delete(e.target)); fl.classList.toggle('hide',vis.size>0)},{threshold:.15});
  setTimeout(()=>fl.classList.remove('hide'),600);
  io.observe($('#plans',s)); io.observe($('#plans2',s));
}
